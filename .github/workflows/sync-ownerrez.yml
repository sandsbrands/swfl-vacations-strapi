name: Sync OwnerRez to Strapi Cloud

on:
  schedule:
    # 10:00 UTC = 6:00 AM US Eastern during EDT (roughly mid-March to
    # early November), 5:00 AM during EST (the rest of the year). Cron
    # on GitHub Actions has no timezone support, so this drifts by an
    # hour across the DST boundary rather than staying pinned to 6 AM
    # year-round - acceptable for a daily content sync.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (log only, write nothing)'
        type: boolean
        default: false

jobs:
  sync:
    # OwnerRez enforces an IP allowlist, and GitHub-hosted runners use
    # dynamic IPs that can't satisfy it - this runs on a self-hosted
    # runner installed on the already-allowlisted machine instead.
    runs-on: [self-hosted, owner-machine]
    defaults:
      run:
        # This machine's PowerShell execution policy blocks running
        # scripts, which is what plain `run:` steps use by default on
        # Windows runners - Git Bash works instead. The Windows
        # service's PATH doesn't include it (see the PATH step below),
        # so a plain `shell: bash` alone can't resolve it; embedding
        # bash.exe's full path directly in `shell:` also doesn't work
        # here (GitHub Actions' path handling rejects a raw drive
        # letter in that field: "Second path fragment must not be a
        # drive or UNC name"). Prepending to PATH and using the plain
        # keyword avoids both problems.
        shell: bash
    steps:
      - name: Add Git Bash to PATH
        shell: cmd
        run: echo C:\Program Files\Git\bin>>%GITHUB_PATH%

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run OwnerRez sync (remote)
        env:
          OWNERREZ_API_BASE_URL: ${{ secrets.OWNERREZ_API_BASE_URL }}
          OWNERREZ_API_KEY: ${{ secrets.OWNERREZ_API_KEY }}
          OWNERREZ_API_TOKEN: ${{ secrets.OWNERREZ_API_TOKEN }}
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        run: |
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            node scripts/sync-ownerrez.js --remote --with-photos --dry-run
          else
            node scripts/sync-ownerrez.js --remote --with-photos
          fi

      # OwnerRez's API has no field for the widget-embed property GUID (see
      # scripts/backfill-widget-ids.js) - it only appears in the booking/
      # inquiry widget already embedded on the property's own
      # swflvacations.com page, so this scrapes it from there instead. Only
      # fills properties where ownerrez_widget_property_id is still empty;
      # never overwrites an existing value. Skipped on dry runs since the
      # script has no --dry-run mode of its own. Properties whose public
      # page doesn't have that widget embedded yet (or isn't live yet) will
      # fail this step harmlessly and still need the ID entered by hand.
      - name: Backfill missing widget property IDs (remote)
        if: ${{ inputs.dryRun != true }}
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        run: node scripts/backfill-widget-ids.js --remote
