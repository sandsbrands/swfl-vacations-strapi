name: Sync OwnerRez bookings to GHL

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (log only, write/call nothing)'
        type: boolean
        default: false

# If the runner goes offline for a while, GitHub mostly avoids piling up a
# separate queued run per missed 15-minute tick on its own, but this makes
# it explicit: only one run is ever queued/active for this workflow at a
# time, and later triggers wait for it rather than each independently
# timing out and reporting its own confusing failure.
concurrency:
  group: sync-ownerrez-bookings
  cancel-in-progress: false

jobs:
  sync:
    # Same reason as sync-ownerrez.yml: OwnerRez enforces an IP allowlist
    # that only this already-allowlisted machine (now a small always-on
    # cloud VM, not a personal machine - see sync-ownerrez.yml) satisfies.
    runs-on: [self-hosted, cloud-runner]
    # Bounds actual execution time once a runner picks the job up (e.g. a
    # hung npm install or a stalled API call) - separate from how long a
    # job can sit queued waiting for a runner, which GitHub caps on its own
    # regardless of this setting (that's what actually resolved the
    # multi-hour queued failures during the outage that prompted moving off
    # a personal machine in the first place).
    timeout-minutes: 20
    env:
      # See sync-ownerrez.yml - the cloud runner's 512MB physical RAM makes
      # Node set too low a default heap limit for `npm ci` to parse this
      # repo's large Strapi lockfile, regardless of swap being available.
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run OwnerRez booking sync (remote)
        env:
          OWNERREZ_API_BASE_URL: ${{ secrets.OWNERREZ_API_BASE_URL }}
          OWNERREZ_API_KEY: ${{ secrets.OWNERREZ_API_KEY }}
          OWNERREZ_API_TOKEN: ${{ secrets.OWNERREZ_API_TOKEN }}
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          GHL_SWFL_PRIVATE_TOKEN: ${{ secrets.GHL_SWFL_PRIVATE_TOKEN }}
        run: |
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            node scripts/sync-ownerrez-bookings.js --remote --dry-run
          else
            node scripts/sync-ownerrez-bookings.js --remote
          fi
